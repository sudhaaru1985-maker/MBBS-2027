<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intestinal Disorders – Case Quiz</title>
<style>
:root{--navy:#1B2A4A;--acc:#B0306A;--plum:#2E1A47;--gold:#F2B632;--teal:#1FA39A;--green:#2EB872;--red:#D64545;--bg:#F6F4FA;--ink:#222}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:22px 16px 18px;border-left:10px solid var(--acc)}
header h1{margin:0 0 4px;font-size:28px}
header p{margin:0;color:#C9CFE0;font-size:16px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e3e0ea;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .score{font-weight:700;color:var(--navy)}
.prog{flex:1;min-width:140px;height:10px;background:#ebe6f3;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
button{font-family:inherit;font-size:16px;cursor:pointer}
.btn{background:var(--plum);color:#fff;border:0;border-radius:8px;padding:9px 16px}
.btn.alt{background:#fff;color:var(--plum);border:2px solid var(--plum)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.tab{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:6px 14px;font-weight:600}
.tab.on{background:var(--navy);color:#fff}
.q{background:#fff;border-radius:12px;padding:18px;margin:0 0 18px;border-left:8px solid var(--c,#999);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.q .tag{display:inline-block;font-size:14px;font-weight:700;background:var(--gold);color:var(--plum);border-radius:12px;padding:2px 10px;margin-right:6px}
.q .tag.t{background:var(--teal);color:#fff}
.q .stem{margin:10px 0 12px;font-size:18px}
.q img{max-width:100%;max-height:340px;display:block;margin:6px 0 12px;border-radius:8px;border:1px solid #ddd}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid #dcd6e6;border-radius:10px;padding:10px 12px;margin:0 0 8px;color:var(--ink);font-size:17px}
.opt b{flex:0 0 30px;height:30px;border-radius:50%;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--plum)}
.opt.ok{border-color:var(--green);background:#E6F7EE}
.opt.ok b{background:var(--green)}
.opt.no{border-color:var(--red);background:#FDECEC}
.opt.no b{background:var(--red)}
.opt[disabled]{cursor:default}
.why{display:none;background:#DDF5EA;border-radius:10px;padding:12px 14px;margin-top:8px;font-size:16px}
.why.show{display:block}
.why h4{margin:0 0 4px;color:var(--navy)}
.why ul{margin:4px 0 0;padding-left:20px}
.match{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px dashed #e3e0ea;padding:8px 0}
.match .ch{display:flex;gap:6px;flex-wrap:wrap}
.match .ch button{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:16px;padding:5px 12px;font-weight:700;font-size:15px}
.match .ch button.ok{background:var(--green);border-color:var(--green);color:#fff}
.match .ch button.no{background:var(--red);border-color:var(--red);color:#fff}
.match .fb{grid-column:1/-1;font-size:15px;color:#4a4f60;display:none}
.match .fb.show{display:block}
.summary{background:#fff;border-radius:12px;padding:20px;border-left:8px solid var(--acc);display:none}
.summary.show{display:block}
.summary table{width:100%;border-collapse:collapse;margin-top:10px}
.summary td,.summary th{border-bottom:1px solid #eee;padding:8px;text-align:left;font-size:16px}
@media (max-width:600px){header h1{font-size:23px}.q{padding:14px}.match{grid-template-columns:1fr}}
</style>
</head>

<header>

const Q = [
 {s:"diarr", stem:"A 30-year-old man starts vomiting and has watery diarrhoea 3 hours after eating fried rice that was left at room temperature overnight and reheated. He has no fever and no blood in the stool. What is the most likely cause?",
  o:["Shigella dysenteriae","Bacillus cereus preformed toxin","Vibrio cholerae","Clostridioides difficile","Entamoeba histolytica"], a:1,
  w:["Onset within 3 hours means the toxin was already in the food. Reheated rice is the classic source of B. cereus.","Shigella and Entamoeba invade the mucosa and cause bloody stools.","Cholera takes 1–3 days to start and gives profuse rice-water stool.","C. difficile follows antibiotic use."]},
 {s:"diarr", stem:"A patient passes several litres of watery stool a day. The diarrhoea carries on even when he stops eating, and colonoscopy shows normal-looking mucosa. Which mechanism of diarrhoea fits best?",
  o:["Osmotic","Exudative","Secretory","Malabsorptive","Disordered motility"], a:2,
  w:["Secretory diarrhoea is driven by active chloride and water secretion, so it continues during fasting.","Osmotic diarrhoea stops when the patient fasts.","Exudative diarrhoea comes with mucosal damage, blood and pus.","Malabsorption gives pale, bulky, greasy stools."]},
 {s:"diarr", stem:"Two days after eating undercooked chicken at a barbecue, a 25-year-old woman develops fever, crampy pain and bloody diarrhoea. Which organism is the most likely cause?",
  o:["Staphylococcus aureus toxin","Vibrio cholerae","Enterotoxigenic E. coli","Campylobacter jejuni","Bacillus cereus toxin"], a:3,
  w:["Campylobacter, often from poultry, invades the mucosa and causes fever and bloody diarrhoea after a 1–3 day incubation.","S. aureus and B. cereus toxins act within hours and do not cause blood in the stool.","Cholera and ETEC are toxin-mediated and give watery stool without blood."]},
 {s:"malab", stem:"A 28-year-old woman has iron deficiency anaemia that does not improve with oral iron, plus intermittent bloating. Her anti-tissue transglutaminase IgA is strongly positive. Which duodenal biopsy finding would support the suspected diagnosis?",
  o:["Non-caseating granulomas with transmural inflammation","PAS-positive foamy macrophages in the lamina propria","Normal villi and normal-looking mucosa","Villous atrophy, crypt hyperplasia and more intraepithelial lymphocytes","Crypt abscesses with pseudopolyps"], a:3,
  w:["Positive anti-tTG with iron deficiency that resists oral iron points to coeliac disease.","Granulomas suggest Crohn disease; foamy PAS-positive macrophages suggest Whipple disease.","Lactase deficiency gives a normal biopsy.","Pseudopolyps belong to ulcerative colitis in the colon."]},
 {s:"malab", img:"smear", stem:"This is the blood film of a woman with 8 months of chronic diarrhoea and pale, bulky stools. Her MCV is 69.7 fL. What does the film show?",
  o:["Macrocytic anaemia with hypersegmented neutrophils","Microcytic hypochromic red cells, consistent with iron deficiency","Spherocytes from haemolysis","Target cells of thalassaemia major","Normal red cells"], a:1,
  w:["The red cells are small with wide central pallor, and the MCV is low: microcytic hypochromic anaemia.","In malabsorption (e.g. coeliac disease), iron is poorly absorbed from the damaged duodenum.","Folate or B12 deficiency would give a macrocytic picture instead."]},
 {s:"malab", stem:"Coeliac disease develops only in people who carry certain HLA types. Which ones?",
  o:["HLA-B27","HLA-DR4","HLA-DQ2 or HLA-DQ8","HLA-DR3 only","HLA-A3"], a:2,
  w:["Almost all patients carry HLA-DQ2 or DQ8, which present modified gliadin to CD4+ T cells.","HLA-B27 is linked with ankylosing spondylitis; HLA-DR4 with rheumatoid arthritis; HLA-A3 with haemochromatosis."]},
 {s:"ibd", stem:"A 22-year-old woman has had crampy right lower abdominal pain, non-bloody diarrhoea and weight loss for a year. She also has a perianal fistula. Colonoscopy shows ulcers in the terminal ileum separated by normal mucosa. Which biopsy finding best supports the likely diagnosis?",
  o:["Inflammation limited to the mucosa, continuous from the rectum","Pseudomembranes of fibrin and neutrophils","Non-caseating epithelioid granulomas","Caseating granulomas with acid-fast bacilli","Flat villi with many intraepithelial lymphocytes"], a:2,
  w:["Ileal disease, skip lesions and a perianal fistula point to Crohn disease; non-caseating granulomas support it.","Continuous mucosal colitis from the rectum is ulcerative colitis.","Caseation with AFB means intestinal TB, the key mimic to exclude.","Pseudomembranes suggest C. difficile; flat villi suggest coeliac disease."]},
 {s:"ibd", img:"cobble", stem:"This resected segment of ileum has a thick, rubbery wall. What is the mucosal pattern called, and which disease does it suggest?",
  o:["Lead-pipe colon – ulcerative colitis","Pseudopolyps – ulcerative colitis","Cobblestone mucosa – Crohn disease","Pseudomembranes – C. difficile colitis","Flask-shaped ulcers – amoebic colitis"], a:2,
  w:["Islands of swollen surviving mucosa between linear ulcers give a cobblestone look, typical of Crohn disease.","A thick wall also points to Crohn disease; UC keeps a normal-thickness wall."]},
 {s:"ibd", stem:"A 35-year-old man with known ulcerative colitis develops severe bloody diarrhoea, fever and a fast pulse. His abdomen is distended and tender, and an X-ray shows the transverse colon is 7 cm wide. What is the most likely complication?",
  o:["Toxic megacolon","Enterovesical fistula","Fibrous stricture with obstruction","Colorectal adenocarcinoma","Ischaemic colitis"], a:0,
  w:["A dilated colon (over 6 cm) with systemic toxicity in severe UC is toxic megacolon. It can perforate.","Fistulas and fibrous strictures belong to Crohn disease, which is transmural.","Cancer develops slowly and does not present as acute toxic dilatation."]},
 {s:"ibd", stem:"A 40-year-old woman with long-standing pancolitis develops itching and a raised alkaline phosphatase. MRCP shows beaded, narrowed bile ducts inside and outside the liver. What is the most likely diagnosis?",
  o:["Primary biliary cholangitis","Choledocholithiasis","Acute viral hepatitis","Budd–Chiari syndrome","Primary sclerosing cholangitis"], a:4,
  w:["PSC is strongly linked with UC and gives the beaded bile ducts seen here.","It raises the risk of cholangiocarcinoma and colorectal cancer.","PBC affects small intrahepatic ducts and is AMA-positive."]},
 {s:"ibd", img:"pseudo", stem:"This colectomy specimen comes from a patient with long-standing bloody diarrhoea. The raised red nodules between the ulcerated areas are best described as:",
  o:["Adenomatous polyps, a premalignant lesion","Pseudopolyps: regenerating mucosa between ulcers","Hamartomatous polyps","Hyperplastic polyps","Cobblestone mucosa of Crohn disease"], a:1,
  w:["In ulcerative colitis, islands of surviving and regenerating mucosa stand up between ulcers as pseudopolyps.","They are inflammatory, not neoplastic, although the background colitis does raise cancer risk."]},
 {s:"ibd", stem:"Which gene is best known for increasing the risk of Crohn disease, because it codes for a sensor of bacterial products inside cells?",
  o:["APC","NOD2","CFTR","HFE","BRCA1"], a:1,
  w:["NOD2 senses bacterial peptidoglycan; faulty versions weaken the response to gut bacteria and raise Crohn risk.","Autophagy genes (ATG16L1, IRGM) are also involved.","APC is the first step in the adenoma–carcinoma sequence; CFTR causes cystic fibrosis; HFE causes haemochromatosis."]},
 {s:"isch", stem:"A 72-year-old woman with atrial fibrillation has sudden severe abdominal pain and then bloody diarrhoea. Which layer of the bowel wall is damaged first?",
  o:["Serosa","Muscularis propria","Submucosa","Mucosa","All layers equally"], a:3,
  w:["The mucosa has high metabolic demand and sits at the end of the blood supply, so it dies first.","Injury then spreads: mucosal → mural → transmural infarction.","An embolus from the fibrillating left atrium usually lodges in the superior mesenteric artery."]},
 {s:"isch", stem:"A 68-year-old man had a long period of low blood pressure during cardiac surgery. The next day he has left-sided abdominal pain and bloody stools. Colonoscopy shows patchy mucosal necrosis around the splenic flexure. What best explains the site of injury?",
  o:["Commonest site of colonic diverticula","Watershed zone between SMA and IMA territories","Commonest site of Crohn disease","Site of an embolus in the SMA trunk","Area drained by the portal vein"], a:1,
  w:["Low perfusion damages watershed zones first; the splenic flexure lies between SMA and IMA supply.","Diverticula cluster in the sigmoid colon; Crohn disease favours the terminal ileum.","An SMA embolus would mainly infarct small bowel."]},
 {s:"polyp", stem:"A 1.5 cm pedunculated polyp from the sigmoid colon shows crowded tubular glands lined by cells with elongated, hyperchromatic, pseudostratified nuclei and reduced mucin. Nothing has invaded beyond the muscularis mucosae. What is the diagnosis?",
  o:["Hyperplastic polyp","Juvenile polyp","Peutz–Jeghers polyp","Tubular adenoma","Invasive adenocarcinoma"], a:3,
  w:["Crowded tubules with dysplastic, pencil-like nuclei define a tubular adenoma.","Hyperplastic polyps have serrated crypts with mature cells and no dysplasia.","Juvenile and Peutz–Jeghers polyps are hamartomas.","Carcinoma needs invasion through the muscularis mucosae."]},
 {s:"polyp", stem:"In a colonic adenoma, which single feature is most strongly linked to the risk of it becoming malignant?",
  o:["Being pedunculated","Size over 1 cm","Location in the rectum","Patient's sex","Presence of goblet cells"], a:1,
  w:["Size is the most important predictor; villous architecture and high-grade dysplasia also raise risk.","A stalk, site and sex matter far less."]},
 {s:"polyp", img:"adenoma", stem:"What single histological finding makes this colonic polyp neoplastic rather than non-neoplastic?",
  o:["Presence of inflammation","Dysplasia of the lining epithelium","A serrated surface","Cystically dilated glands","Smooth muscle bundles"], a:1,
  w:["Dysplasia defines an adenoma: crowded glands with elongated, hyperchromatic nuclei.","A serrated surface without dysplasia suggests a hyperplastic polyp.","Cystic glands suggest a juvenile polyp; branching smooth muscle suggests Peutz–Jeghers."]}
];
const M = [
 ["Non-caseating granulomas","CD"],["Rectum always involved","UC"],["Crypt abscesses","BOTH"],["Perianal fistula","CD"],
 ["Toxic megacolon","UC"],["Raised colorectal cancer risk","BOTH"],["Creeping fat and string sign","CD"],["Pyoderma gangrenosum and PSC","UC"],
 ["Skip lesions","CD"],["Inflammation limited to mucosa","UC"]
];
const MFB = {CD:"Crohn disease",UC:"Ulcerative colitis",BOTH:"Both"};
const KEY = "intestinal-cbl-quiz-v1";
let st = {q:{}, m:{}};
try { const raw = localStorage.getItem(KEY); if (raw) st = JSON.parse(raw); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }
let cur = "diarr";
const L = "ABCDE";
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function secColor(id){return SECTIONS.find(s=>s.id===id).color}
function renderTabs(){
  const t = document.getElementById("tabs"); t.innerHTML = "";
  SECTIONS.forEach(s=>{const b=document.createElement("button");b.className="tab"+(s.id===cur?" on":"");b.textContent=s.name;b.onclick=()=>{cur=s.id;render()};t.appendChild(b)});
}
function render(){
  renderTabs();
  document.getElementById("summary").classList.remove("show");
  const list = document.getElementById("list"); list.innerHTML = "";
  if (cur === "match") { renderMatch(list); updateScore(); return; }
  Q.forEach((q,i)=>{
    if (q.s !== cur) return;
    const d = document.createElement("div"); d.className="q"; d.style.setProperty("--c", secColor(q.s));
    let h = `<span class="tag">Q${i+1}</span><span class="tag t">${SECTIONS.find(s=>s.id===q.s).name}</span><div class="stem">${esc(q.stem)}</div>`;
    if (q.img) h += `<img src="${IMG[q.img]}" alt="Image for question ${i+1}">`;
    d.innerHTML = h;
    q.o.forEach((o,j)=>{
      const b = document.createElement("button"); b.className="opt"; b.innerHTML=`<b>${L[j]}</b><span>${esc(o)}</span>`;
      const ans = st.q[i];
      if (ans !== undefined){ b.disabled=true; if (j===q.a) b.classList.add("ok"); else if (j===ans) b.classList.add("no"); }
      b.onclick=()=>{ st.q[i]=j; save(); render(); };
      d.appendChild(b);
    });
    const w = document.createElement("div"); w.className="why"+(st.q[i]!==undefined?" show":"");
    const right = st.q[i]===q.a;
    w.innerHTML = `<h4>${st.q[i]===undefined?"":(right?"✓ Correct":"✗ Not quite – the answer is "+L[q.a])}</h4><ul>${q.w.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul>`;
    d.appendChild(w); list.appendChild(d);
  });
  updateScore();
}
function renderMatch(list){
  const d = document.createElement("div"); d.className="q"; d.style.setProperty("--c", secColor("match"));
  d.innerHTML = `<span class="tag">Matching</span><div class="stem">Is each feature typical of Crohn disease (CD), ulcerative colitis (UC) or both?</div>`;
  M.forEach((m,i)=>{
    const r = document.createElement("div"); r.className="match";
    r.innerHTML = `<div>${i+1}. ${esc(m[0])}</div>`;
    const ch = document.createElement("div"); ch.className="ch";
    ["CD","UC","BOTH"].forEach(c=>{
      const b=document.createElement("button"); b.textContent=c==="BOTH"?"Both":c;
      const a = st.m[i];
      if (a!==undefined){ b.disabled=true; if(c===m[1]) b.classList.add("ok"); else if(c===a) b.classList.add("no"); }
      b.onclick=()=>{st.m[i]=c; save(); render();};
      ch.appendChild(b);
    });
    r.appendChild(ch);
    const fb=document.createElement("div"); fb.className="fb"+(st.m[i]!==undefined?" show":"");
    fb.textContent = st.m[i]===undefined?"":(st.m[i]===m[1]?"✓ Correct: ":"✗ Answer: ")+MFB[m[1]];
    r.appendChild(fb); d.appendChild(r);
  });
  list.appendChild(d);
}
function counts(){
  let done=0, right=0;
  Q.forEach((q,i)=>{ if(st.q[i]!==undefined){done++; if(st.q[i]===q.a) right++;} });
  M.forEach((m,i)=>{ if(st.m[i]!==undefined){done++; if(st.m[i]===m[1]) right++;} });
  return {done,right,total:Q.length+M.length};
}
function updateScore(){
  const c=counts();
  document.getElementById("score").textContent=`Score: ${c.right} / ${c.done}`;
  document.getElementById("prog").style.width=(100*c.done/c.total)+"%";
}
document.getElementById("sumBtn").onclick=()=>{
  const s=document.getElementById("summary"); document.getElementById("list").innerHTML="";
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  let rows="";
  SECTIONS.forEach(sec=>{
    let d=0,r=0,t=0;
    if(sec.id==="match"){ M.forEach((m,i)=>{t++; if(st.m[i]!==undefined){d++; if(st.m[i]===m[1]) r++;}}); }
    else Q.forEach((q,i)=>{ if(q.s!==sec.id) return; t++; if(st.q[i]!==undefined){d++; if(st.q[i]===q.a) r++;} });
    rows+=`<tr><td style="border-left:6px solid ${sec.color}">${sec.name}</td><td>${r} / ${t}</td><td>${d<t?(t-d)+" left":"Done"}</td></tr>`;
  });
  const c=counts();
  s.innerHTML=`<h2 style="margin:0;color:#1B2A4A">Your results: ${c.right} / ${c.total}</h2><p>${c.done<c.total?"You still have "+(c.total-c.done)+" items to answer.":"All items answered. Go back to any section you found hard and read the explanations again."}</p><table><tr><th>Section</th><th>Correct</th><th>Status</th></tr>${rows}</table>`;
  s.classList.add("show");
};
document.getElementById("reset").onclick=()=>{ st={q:{},m:{}}; save(); cur="diarr"; render(); window.scrollTo(0,0); };
render();
</script>
</body>
</html>
