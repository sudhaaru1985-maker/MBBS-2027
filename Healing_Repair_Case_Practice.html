<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healing & Repair – Clinical Case Practice</title>
<style>
:root{--navy:#1F2A44;--plum:#2E1A47;--gold:#F2B705;--teal:#1A9E9E;--green:#1EA04F;--red:#C0392B;--pink:#FFCCFF;--lav:#E6E0F8;--ice:#E3F2FD;--yel:#FFF6CC;--mint:#D9F5E5;--text:#262626;--bg:#F5F3FA;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Calibri,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:1.45rem}
header p{margin:4px 0 0;color:var(--pink);font-size:0.95rem}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid #b9b0d0;background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:var(--plum)}
.dot.cur{outline:3px solid var(--gold)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.bad{background:var(--red);border-color:var(--red);color:#fff}
.card{background:#fff;border-radius:14px;padding:18px;border-left:8px solid var(--c,#7a5cc0);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700}
.p1{background:var(--gold);color:var(--plum)} .p2{background:var(--teal);color:#fff} .p3{background:var(--lav);color:var(--plum)}
.vig{font-size:1.05rem;margin:0 0 10px}
.case-img{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:8px auto 12px;border:1px solid #ddd}
.q{font-weight:700;color:var(--plum);margin:6px 0 12px;font-size:1.05rem}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid #ddd6ee;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:16px;cursor:pointer;color:var(--text);font-family:inherit}
.opt:hover:not([disabled]){border-color:var(--teal);background:#f6fbfb}
.opt .l{flex:0 0 32px;height:32px;border-radius:50%;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.right{border-color:var(--green);background:#eafaf0}
.opt.right .l{background:var(--green)}
.opt.wrong{border-color:var(--red);background:#fdecea}
.opt.wrong .l{background:var(--red)}
.opt[disabled]{cursor:default}
.why{display:none;background:var(--mint);border-radius:12px;padding:12px 14px;margin-top:12px}
.why.show{display:block}
.why h3{margin:0 0 6px;font-size:1rem}
.why p{margin:4px 0}
.verdict{font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{background:var(--plum);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:16px;cursor:pointer;font-family:inherit}
.btn.alt{background:#fff;color:var(--plum);border:2px solid var(--plum)}
.btn[disabled]{opacity:.4;cursor:default}
.score{text-align:center}
.score .big{font-size:3rem;font-weight:800;color:var(--plum);margin:6px 0}
.rev{text-align:left;margin-top:14px}
.rev div{padding:8px 12px;border-radius:10px;margin:6px 0;font-size:15px}
.rev .ok{background:#eafaf0;border-left:6px solid var(--green)}
.rev .bad{background:#fdecea;border-left:6px solid var(--red)}
.rev .na{background:#f1f1f1;border-left:6px solid #aaa}
@media (max-width:560px){header h1{font-size:1.2rem}.card{padding:14px}.dot{width:30px;height:30px;font-size:13px}}
</style>
</head>

const CASES = [
{t:'Regeneration',c:'#E84393',
 v:'A 45-year-old man donates the right lobe of his liver (about 60% of its volume) to his brother. A CT scan four months later shows that his remaining liver has grown back almost to its original size, and his liver function tests are normal.',
 q:'Which statement best explains this recovery?',
 o:['Hepatocytes are permanent cells, so the gap filled with fibrous tissue','Quiescent hepatocytes re-entered the cell cycle from G0 under growth-factor stimulation','Bone marrow stem cells migrated to the liver and became hepatocytes','The remaining hepatocytes enlarged without dividing','Embryonic stem cells stored in the liver were activated'],a:1,
 w:['Hepatocytes are <b>stable</b> cells resting in G0. Cytokines (IL-6, TNF) prime them and growth factors (HGF, TGF-α) push them into the cell cycle.','A is wrong because fibrosis would not restore liver function. C: bone marrow cells contribute very little. D: enlargement alone cannot rebuild 60% of the organ. E: adults do not carry embryonic stem cells.']},
{t:'Regeneration',c:'#6C5CE7',
 v:'A 58-year-old man survives a large anterior wall myocardial infarction. Eight weeks later, echocardiography shows that part of the left ventricular wall is thin and does not contract.',
 q:'What has most likely replaced the dead myocardium?',
 o:['New cardiac muscle cells formed from cardiac stem cells','Regenerated cardiac myocytes from surviving neighbouring cells','A dense collagen-rich scar','Granulation tissue that stays permanently','Smooth muscle cells from the coronary arteries'],a:2,
 w:['Cardiac myocytes are <b>permanent</b> cells, so an infarct heals by <b>scar</b>. Scar restores structure but cannot contract.','D: granulation tissue is temporary and has been replaced by collagen by about 6–8 weeks. A, B, E: any myocyte renewal in adults is far too small to replace an infarct.']},
{t:'Regeneration',c:'#0984E3',
 v:'A 70-year-old woman had an ischaemic stroke six months ago. An MRI shows a cavity surrounded by a firm rim of tissue in the area that was damaged.',
 q:'Which process mainly repaired her brain?',
 o:['Regeneration of neurons from surviving neurons','Collagen-rich fibrous scar made by meningeal fibroblasts only','Complete restoration by neural stem cells','Gliosis: proliferation of glial cells (mainly astrocytes)','Granulation tissue that persists indefinitely'],a:3,
 w:['Neurons are <b>permanent</b> cells. Damage in the central nervous system is repaired mainly by <b>gliosis</b>, which is the brain\'s version of a scar.','A and C: adult neurons cannot replace a large area of loss. B: fibroblasts play only a small part in the brain. E: granulation tissue does not last for months.']},
{t:'Scar formation',c:'#00B894',img:'gran',
 v:'A 30-year-old man burnt the back of his hand on a hot exhaust pipe. On day 7, the base of the wound is bright red, moist and granular, and it bleeds easily when the dressing is removed.',
 q:'A biopsy from the base of this wound would mostly show:',
 o:['Dense bundles of collagen with very few cells','Sheets of neutrophils in fibrin, with no fibroblasts','Granulomas made of epithelioid macrophages and giant cells','New capillaries, proliferating fibroblasts, oedematous matrix and macrophages','Fully regenerated epidermis with a normal keratin layer'],a:3,
 w:['This is <b>granulation tissue</b>. Its new capillaries are leaky and fragile, so the tissue looks red and swollen and bleeds easily.','A describes a mature scar, weeks later. B describes acute inflammation at about 24 hours. C is a granuloma, a different process seen in chronic inflammation such as TB. E: new epidermis covers the surface, not the base.']},
{t:'Scar formation',c:'#E17055',
 v:'A 72-year-old man who lives alone has eaten mostly tea and biscuits for a year. He has swollen, bleeding gums, bruises easily, and a scar from an old hernia operation has started to break down.',
 q:'Which step in collagen production is most affected?',
 o:['Hydroxylation of proline and lysine residues','Transcription of collagen genes in the nucleus','Glycosylation of procollagen in the Golgi','Release of procollagen from fibroblasts','Breakdown of collagen by metalloproteinases'],a:0,
 w:['This is <b>scurvy</b> (vitamin C deficiency). Vitamin C is needed to <b>hydroxylate</b> proline and lysine, which lets collagen form stable triple helices.','Without it collagen is weak, so vessels bleed, wounds heal poorly and old scars can reopen. The other steps do not depend on vitamin C.']},
{t:'Wound healing',c:'#FDCB6E',
 v:'A surgeon reviews a clean, sutured abdominal incision on the fifth day after operation. The wound is healing normally.',
 q:'Which finding is expected in the incision at this stage?',
 o:['Neutrophils are the main cells and there is no collagen yet','A dense, avascular scar with no inflammatory cells','The wound has regained about 80% of normal strength','Sweat glands and hair follicles have regrown in the scar','Granulation tissue fills the incision and collagen fibrils start to bridge it'],a:4,
 w:['By <b>day 5</b> neovascularisation is at its peak, granulation tissue fills the gap and collagen fibrils begin to <b>bridge</b> the incision.','A fits the first 24 hours. B fits the end of the first month. C: strength reaches 70–80% only by about 3 months. D: skin appendages lost in the incision line do not grow back.']},
{t:'Wound healing',c:'#A29BFE',img:'open',
 v:'A 40-year-old farmer has a large, ragged laceration on his thigh contaminated with soil. It is cleaned and left open to heal. Over the next six weeks it fills in from its base and its surface area shrinks to a fraction of the original size.',
 q:'Which cell is mainly responsible for the reduction in wound size?',
 o:['Neutrophil','Keratinocyte','Myofibroblast','Mast cell','Plasma cell'],a:2,
 w:['This is healing by <b>second intention</b>. <b>Myofibroblasts</b> contain smooth-muscle actin and contract, pulling the edges of the wound inward.','B: keratinocytes cover the surface but do not shrink it. A, D, E are inflammatory cells and do not cause contraction.']},
{t:'Wound healing',c:'#55EFC4',
 v:'A 28-year-old man has his appendix removed through a small incision. His sutures are taken out on day 8. He asks whether he can go back to heavy weight training at the gym that week.',
 q:'Roughly how strong is his wound compared with normal skin at this point?',
 o:['About 10%','About 50%','About 80%','100%: it is fully healed','More than 100%, because scar is tougher than skin'],a:0,
 w:['When sutures are removed at about one week, the wound has only <b>about 10%</b> of normal strength. Strength rises quickly over the next four weeks and levels off at <b>70–80%</b> by about three months.','A scar never regains 100% strength, so heavy lifting should wait several weeks.']},
{t:'Factors affecting healing',c:'#D63031',img:'foot',
 v:'A 62-year-old woman with diabetes for 20 years has a painless ulcer on the sole of her foot that has not healed in three months. Her foot pulses are weak and she cannot feel a monofilament on the sole.',
 q:'Which combination best explains why this ulcer is not healing?',
 o:['Excess collagen and too much wound contraction','Keloid formation at the edge of the ulcer','Too much vitamin C and zinc in the diet','Nerve damage, poor blood supply and a high risk of infection','Excess granulation tissue rising above the skin'],a:3,
 w:['Diabetes delays healing in several ways: <b>neuropathy</b> (she does not feel pressure or injury), <b>poor perfusion</b> from vascular disease, and a higher risk of <b>infection</b>.','A, B and E describe excessive repair, the opposite problem. C: these nutrients help healing.']},
{t:'Factors affecting healing',c:'#636E72',img:'dehis',
 v:'A 65-year-old man has taken high-dose prednisolone for many years for rheumatoid arthritis. He has an open bowel operation. On day 8, while coughing, he feels a "pop" and pink fluid leaks from his abdominal wound; the wound edges have separated.',
 q:'What is the most likely reason this wound failed?',
 o:['Excess collagen deposition at the incision','Glucocorticoids suppressed inflammation and TGF-β, so the scar was weak','Keloid formation in the wound','Excessive wound contraction by myofibroblasts','Too much granulation tissue above the skin surface'],a:1,
 w:['This is <b>wound dehiscence</b>. Steroids dampen inflammation and reduce TGF-β, so too little collagen is laid down. Coughing raised the pressure inside the abdomen on a wound that was still weak.','A, C, D and E describe excessive repair, the opposite problem.']},
{t:'Abnormal repair',c:'#2D3436',img:'keloid',
 v:'A 23-year-old woman had both earlobes pierced. A year later she has a firm, shiny, raised nodule on one earlobe that has grown well beyond the margins of the original hole. It was removed once before and came back.',
 q:'What is the most likely diagnosis?',
 o:['Hypertrophic scar','Exuberant granulation tissue','Wound contracture','Wound dehiscence','Keloid'],a:4,
 w:['A <b>keloid</b> is excess collagen that grows <b>beyond</b> the wound margins, does not regress and often recurs after removal. There is a genetic tendency.','A: a hypertrophic scar stays within the wound and often fades. B is soft, red and bleeds easily. C and D describe contraction and rupture, not a nodule.']}
];
const KEY='healrepair_y1_v1';
let st={ans:Array(CASES.length).fill(null),cur:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ans&&s.ans.length===CASES.length)st=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const $=id=>document.getElementById(id);
function bar(){
  $('bar').innerHTML=CASES.map((c,i)=>{let cl='dot';const a=st.ans[i];if(a!==null)cl+=a===c.a?' ok':' bad';if(i===st.cur)cl+=' cur';
   return `<button class="${cl}" onclick="go(${i})" aria-label="Case ${i+1}">${i+1}</button>`}).join('')+
   `<button class="dot${st.cur===CASES.length?' cur':''}" style="width:auto;padding:0 12px;border-radius:17px" onclick="go(${CASES.length})">Score</button>`;
}
function render(){
  bar();
  if(st.cur===CASES.length)return score();
  const c=CASES[st.cur],a=st.ans[st.cur];
  let h=`<div class="card" style="--c:${c.c}"><div class="pills"><span class="pill p1">CASE ${st.cur+1} / ${CASES.length}</span><span class="pill p2">CLINICAL CASE</span><span class="pill p3">${c.t}</span></div>`;
  h+=`<p class="vig">${c.v}</p>`;
  if(c.img)h+=`<img class="case-img" src="${IMG[c.img]}" alt="Clinical image for case ${st.cur+1}">`;
  h+=`<p class="q">${c.q}</p>`;
  c.o.forEach((o,i)=>{let cl='opt';if(a!==null){if(i===c.a)cl+=' right';else if(i===a)cl+=' wrong';}
    h+=`<button class="${cl}" ${a!==null?'disabled':''} onclick="pick(${i})"><span class="l">${'ABCDE'[i]}</span><span>${o}</span></button>`});
  h+=`<div class="why ${a!==null?'show':''}"><h3 class="verdict">${a===null?'':(a===c.a?'✓ Correct':'✗ Not quite. The answer is '+'ABCDE'[c.a])}</h3>${c.w.map(p=>`<p>${p}</p>`).join('')}</div>`;
  h+=`<div class="nav"><button class="btn alt" ${st.cur===0?'disabled':''} onclick="go(${st.cur-1})">← Previous</button><button class="btn" onclick="go(${st.cur+1})">${st.cur===CASES.length-1?'See score →':'Next →'}</button></div></div>`;
  $('main').innerHTML=h;
}
function pick(i){if(st.ans[st.cur]!==null)return;st.ans[st.cur]=i;save();render();}
function go(i){st.cur=Math.max(0,Math.min(CASES.length,i));save();render();window.scrollTo({top:0,behavior:'smooth'});}
function score(){
  const done=st.ans.filter(x=>x!==null).length,right=st.ans.filter((x,i)=>x===CASES[i].a).length;
  let h=`<div class="card score" style="--c:var(--gold)"><h2>Your score</h2><div class="big">${right} / ${CASES.length}</div><p>${done<CASES.length?`You have answered ${done} of ${CASES.length} cases.`:(right>=9?'Excellent work.':right>=6?'Good. Revisit the cases you missed.':'Go back over the lecture slides, then try again.')}</p><div class="rev">`;
  CASES.forEach((c,i)=>{const a=st.ans[i];const cl=a===null?'na':a===c.a?'ok':'bad';
    h+=`<div class="${cl}" onclick="go(${i})" style="cursor:pointer"><b>Case ${i+1}</b> · ${c.t}: ${a===null?'not answered':a===c.a?'correct':'incorrect (answer '+'ABCDE'[c.a]+')'}</div>`});
  h+=`</div><div class="nav"><button class="btn alt" onclick="go(0)">Review from start</button><button class="btn" onclick="reset()">Reset and try again</button></div></div>`;
  $('main').innerHTML=h;
}
function reset(){st={ans:Array(CASES.length).fill(null),cur:0};save();render();}
render();
</script>
</body>
</html>
