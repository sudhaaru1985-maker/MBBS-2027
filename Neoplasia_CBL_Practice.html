<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neoplasia CBL Practice</title>
<style>
:root{--plum:#2E1A47;--plum2:#452C66;--gold:#F2C14E;--teal:#1FA2A0;--mint:#C8F7DC;--green:#2E9E5B;--red:#C0392B;--bg:#F6F3FB;--ink:#222;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{background:var(--plum);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:24px}header p{margin:4px 0 0;opacity:.85;font-size:15px}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--plum2);position:sticky;top:0;z-index:5}
nav button{border:0;border-radius:20px;padding:8px 14px;font-size:15px;font-weight:700;background:#fff;color:var(--plum);cursor:pointer}
nav button.on{background:var(--gold)}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:16px;margin:0 0 16px;border-left:6px solid var(--c,#1FA2A0);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:12px;padding:2px 10px;margin-right:6px}
.pg{background:var(--gold);color:var(--plum)}.pt{background:var(--teal);color:#fff}
.opt{display:block;width:100%;text-align:left;border:2px solid #ddd;background:#fff;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--plum2)}.opt b{display:inline-block;width:26px;color:var(--plum2)}
.opt.right{border-color:var(--green);background:#E6F7EC}.opt.wrong{border-color:var(--red);background:#FDECEA}
.why{background:var(--mint);border-radius:10px;padding:10px 12px;margin-top:8px;display:none}.why.show{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.row .t{flex:1 1 200px;font-weight:700;color:var(--plum)}
select{flex:2 1 260px;font-size:15px;padding:8px;border-radius:8px;border:2px solid #ccc;max-width:100%}
select.right{border-color:var(--green);background:#E6F7EC}select.wrong{border-color:var(--red);background:#FDECEA}
.btn{border:0;border-radius:8px;padding:9px 16px;font-size:15px;font-weight:700;background:var(--plum);color:#fff;cursor:pointer;margin:6px 6px 0 0}
.btn.alt{background:#fff;color:var(--plum);border:2px solid var(--plum)}
.fb{font-weight:700;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.spot img{width:100%;height:220px;object-fit:contain;background:#111;border-radius:8px}
.num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--plum);font-weight:800;align-items:center;justify-content:center;margin-right:6px}
textarea{width:100%;min-height:60px;font-size:15px;padding:8px;border-radius:8px;border:1px solid #bbb;font-family:inherit}
.ans{background:var(--mint);border-radius:8px;padding:8px 10px;margin-top:6px;display:none}.ans.show{display:block}
.stem{background:var(--plum2);color:#fff;border-radius:10px;padding:12px 14px}
.score{font-size:20px;font-weight:800;color:var(--plum)}
.bar{height:14px;background:#e4def0;border-radius:7px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--teal)}
</style></head><body>

<script>
const D = {"mcq": [{"stem": "A 24-year-old woman has a 6 cm ovarian cyst removed. It contains hair, greasy sebaceous material and a tooth. Microscopy shows skin, cartilage and respiratory epithelium. What is the lesion?", "opts": ["Hamartoma", "Choristoma", "Mature cystic teratoma (dermoid cyst)", "Mucinous adenocarcinoma", "Pleomorphic adenoma"], "ans": 2, "why": "Tissues from more than one germ layer, arising from germ cells in the gonad, make this a teratoma; mature tissues in a cyst mean it is benign. A hamartoma contains tissue native to the site, and hair and teeth are not native to the ovary. A choristoma is a rest of normal tissue. Adenocarcinoma is a malignant glandular tumour, and pleomorphic adenoma is a salivary gland tumour."}, {"stem": "A 50-year-old man has had a soft, mobile lump on his back for 6 years. It is excised: encapsulated, yellow and lobulated, made of mature fat cells. Which single feature proves that a tumour is malignant?", "opts": ["Large size", "Rapid growth", "Presence of mitoses", "Metastasis", "Lack of a capsule"], "ans": 3, "why": "Benign tumours never metastasise, so metastasis is the one unequivocal marker of malignancy. Size and growth rate overlap between benign and malignant tumours, mitoses occur in normal and benign proliferating tissue, and some benign tumours (a haemangioma, for example) have no capsule."}, {"stem": "A 32-year-old woman has an abnormal Pap smear. Cervical biopsy shows atypical cells through the full thickness of the squamous epithelium. The basement membrane is intact. Why can this lesion not metastasise yet?", "opts": ["The cells are well differentiated", "It has no access to lymphatics or blood vessels", "It is a benign neoplasm", "HPV-related tumours never spread", "The immune system removes all the cells"], "ans": 1, "why": "This is carcinoma in situ. Lymphatics and capillaries lie below the basement membrane, so the cells cannot reach them until they invade. The cells are anaplastic rather than well differentiated, the lesion is not benign, and HPV-driven carcinomas do metastasise once they become invasive."}, {"stem": "A 64-year-old man with adenocarcinoma of the sigmoid colon has several nodules scattered through the liver on CT. How did the tumour most likely reach the liver?", "opts": ["Seeding across the peritoneal cavity", "Lymphatic spread to para-aortic nodes", "Haematogenous spread through the portal vein", "Direct invasion into the liver", "Spread along nerves"], "ans": 2, "why": "Venous blood from the colon drains into the portal vein, so the liver is the first capillary bed the tumour cells meet. Peritoneal seeding gives surface implants rather than nodules inside the liver, lymphatic spread goes first to the mesenteric nodes, and the sigmoid colon does not touch the liver."}, {"stem": "A 2-year-old has a white pupillary reflex in both eyes. His father had an eye removed for a tumour in early childhood. What best explains why this child developed tumours so early and in both eyes?", "opts": ["Two somatic RB mutations in the same retinal cell", "An inherited RB mutation plus one somatic \"second hit\"", "An activating RAS mutation", "A germline TP53 mutation", "Overexpression of BCL-2"], "ans": 1, "why": "In familial retinoblastoma every cell already carries one mutant RB allele, so one more hit in any retinal cell is enough. That is why the tumours come early and are often bilateral. Two somatic hits give sporadic disease, usually in one eye of an older child. A germline TP53 mutation causes Li-Fraumeni syndrome."}, {"stem": "A 63-year-old heavy smoker is brought in confused. He has lost 8 kg. Serum sodium is 118 mmol/L and the chest X-ray shows a central hilar mass. What is the most likely cause?", "opts": ["Squamous cell carcinoma secreting PTHrP", "Small cell carcinoma secreting ADH", "Renal cell carcinoma secreting erythropoietin", "Lung adenocarcinoma with a single brain metastasis", "Carcinoid tumour secreting serotonin"], "ans": 1, "why": "Inappropriate ADH causes water retention, dilutional hyponatraemia and confusion, and small cell carcinoma is the classic central tumour behind it. PTHrP causes hypercalcaemia and EPO causes polycythaemia. A brain metastasis could explain the confusion but not the low sodium, and carcinoid causes flushing and diarrhoea."}, {"stem": "A 52-year-old woman has a 3 cm breast carcinoma, histological grade 3 (poorly differentiated). Two axillary nodes contain tumour and there are no distant metastases. Which statement is correct?", "opts": ["Grade predicts outcome better than stage", "Stage generally predicts outcome better than grade", "Grade 3 means distant metastases are present", "The TNM stage is based on how differentiated the cells look", "The sentinel node biopsy tells us the grade"], "ans": 1, "why": "Stage (size, nodes, metastases) carries more prognostic weight than grade; this patient is T2 N1 M0. Grade describes differentiation under the microscope and says nothing about spread. The sentinel node tells us the nodal status, the N in TNM."}], "match": [{"title": "Nomenclature", "terms": ["Leiomyoma", "Liposarcoma", "Adenocarcinoma", "Melanoma", "Lymphoma", "Hamartoma", "Choristoma", "Teratoma"], "answers": ["Benign tumour of smooth muscle", "Malignant tumour of fat", "Malignant tumour of glandular epithelium", "Malignant tumour of melanocytes", "Malignant tumour of lymphoid cells", "Disorganised but mature tissue native to the site", "Normal tissue in an abnormal site", "Germ cell tumour with tissues from more than one germ layer"]}, {"title": "Hallmark or example?", "terms": ["BCR-ABL in CML", "RB loss in retinoblastoma", "BCL-2 in follicular lymphoma", "Telomerase activation", "VEGF secretion", "Loss of E-cadherin", "PD-L1 expression", "Warburg effect on PET"], "answers": ["Sustaining proliferative signalling", "Evading growth suppressors", "Resisting cell death", "Replicative immortality", "Inducing angiogenesis", "Activating invasion and metastasis", "Avoiding ntum. Cytology of the ascitic fluid shows clusters of malignant epithelial cells.", "qa": [["By which route has this tumour spread?", "Seeding of a body cavity: tumour cells shed into the peritoneal cavity and implant on the omentum and serosal surfaces."], ["Why can the ascitic fluid be used for diagnosis?", "Tumour cells float free in the fluid, so a simple tap and cytology can show malignant cells."], ["Name two other tumours that spread this way.", "Carcinomas of the stomach, colon and pancreas; mesothelioma in the pleura."]]}, {"title": "Putting it all together", "stem": "A 66-year-old man has had a change in bowel habit for 4 months, dark blood in his stool and 7 kg weight loss. Hb is 9.2 g/dL with small, pale red cells. Colonoscopy shows an ulcerated, ring-like mass in the sigmoid colon. Biopsy: malignant glands invading the submucosa, moderately differentiated. CT shows three nodules in the liver. Serum CEA is raised.", "qa": [["Name the tumour.", "Adenocarcinoma of the colon, a malignant tumour of glandular epithelium."], ["Why is he anaemic?", "Chronic blood loss from the ulcerated tumour, giving iron deficiency anaemia."], ["How did it reach the liver?", "Haematogenous spread through the portal vein."], ["What is the grade? Is he M0 or M1?", "Grade 2 (moderately differentiated). M1 because of distant metastases, so stage IV."], ["How is CEA useful here?", "Not for diagnosis. It is used to follow the response to treatment and to pick up recurrence."], ["Why has he lost weight?", "Cancer cachexia: TNF, IL-1, IL-6 and tumour-derived factors raise metabolism and break down fat and muscle."]]}]};
const COLORS=['#1FA2A0','#F2C14E','#8E44AD','#E67E22','#2E86C1','#C0392B','#27AE60','#D35400'];
const KEY='neoplasia_cbl_y1_v1';
let S={mcq:{},match:{},spot:{},notes:{}};
try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(S,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const tabs=[['mcq','Case MCQs'],['match','Matching'],['spot','Spotters'],['cases','Case discussions'],['score','My score']];
let cur='mcq';
function nav(){document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===cur?'on':''}" onclick="go('${k}')">${l}</button>`).join('');}
function go(k){cur=k;nav();render();window.scrollTo(0,0);}
function shuffleIdx(n,seed){const a=[...Array(n).keys()];let s=seed*9301+49297;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function rMCQ(){return D.mcq.map((q,i)=>{const ch=S.mcq[i];const done=ch!==undefined;
 return `<div class="card" style="--c:${COLORS[i%8]}"><span class="pill pg">Quick check ${i+1}</span><span class="pill pt">Clinical case</span>
 <p>${esc(q.stem)}</p>${q.opts.map((o,j)=>{let c='';if(done){if(j===q.ans)c='right';else if(j===ch)c='wrong';}
 return `<button class="opt ${c}" ${done?'disabled':''} onclick="pick(${i},${j})"><b>${'ABCDE'[j]}.</b>${esc(o)}</button>`}).join('')}
 <div class="why ${done?'show':''}"><b>${done?(ch===q.ans?'Correct. ':'Not quite. The answer is '+'ABCDE'[q.ans]+'. '):''}</b>${esc(q.why)}</div></div>`}).join('')+
 `<button class="btn alt" onclick="resetPart('mcq')">Reset MCQs</button>`;}
function pick(i,j){S.mcq[i]=j;save();render();}

function rMatch(){return D.match.map((m,i)=>{const order=shuffleIdx(m.answers.length,i+3);const st=S.match[i]||{};const checked=st.checked;
 let right=0;const rows=m.terms.map((t,k)=>{const v=st.v?st.v[k]:'';let c='';if(checked){c=(v!==''&&+v===k)?'right':'wrong';if(c==='right')right++;}
  return `<div class="row"><span class="t">${esc(t)}</span><select class="${c}" onchange="setM(${i},${k},this.value)" ${checked?'disabled':''}><option value="">Choose…</option>${order.map(a=>`<option value="${a}" ${String(v)===String(a)?'selected':''}>${esc(m.answers[a])}</option>`).join('')}</select></div>`+
  (checked&&c==='wrong'?`<div style="margin:-4px 0 6px;color:var(--green);font-size:15px">Answer: ${esc(m.answers[k])}</div>`:'');}).join('');
 return `<div class="card" style="--c:${COLORS[(i+2)%8]}"><span class="pill pg">Match it ${i+1}</span><h3 style="margin:6px 0">${esc(m.title)}</h3>${rows}
 ${checked?`<div class="fb">${right} / ${m.terms.length} correct</div><button class="btn alt" onclick="clrM(${i})">Try again</button>`:`<button class="btn" onclick="chkM(${i})">Check answers</button>`}</div>`}).join('');}
function setM(i,k,v){S.match[i]=S.match[i]||{v:{}};S.match[i].v=S.match[i].v||{};S.match[i].v[k]=v;save();}
function chkM(i){S.match[i]=S.match[i]||{v:{}};S.match[i].checked=true;save();render();}
function clrM(i){delete S.match[i];save();render();}

function rSpot(){return D.spot.map((sp,i)=>{const st=S.spot[i]||{};const checked=st.checked;let right=0;
 const cells=sp.items.map(([src,ans],k)=>{const v=st.v?st.v[k]:'';let c='';if(checked){c=(v!==''&&+v===ans)?'right':'wrong';if(c==='right')right++;}
  return `<div class="spot"><div><span class="num">${k+1}</span></div><img src="${src}" alt="Spotter image ${k+1}"><div class="row"><select class="${c}" onchange="setS(${i},${k},this.value)" ${checked?'disabled':''}><option value="">Choose…</option>${sp.opts.map((o,j)=>`<option value="${j}" ${String(v)===String(j)?'selected':''}>${esc(o)}</option>`).join('')}</select></div>${checked&&c==='wrong'?`<div style="color:var(--green);font-size:15px">Answer: ${esc(sp.opts[ans])}</div>`:''}</div>`}).join('');
 return `<div class="card" style="--c:${COLORS[(i+5)%8]}"><span class="pill pg">Spotter ${i+1}</span><h3 style="margin:6px 0">${esc(sp.title)}</h3><div class="grid">${cells}</div>
 ${checked?`<div class="fb">${right} / ${sp.items.length} correct</div><button class="btn alt" onclick="clrS(${i})">Try again</button>`:`<button class="btn" onclick="chkS(${i})">Check answers</button>`}</div>`}).join('');}
function setS(i,k,v){S.spot[i]=S.spot[i]||{v:{}};S.spot[i].v=S.spot[i].v||{};S.spot[i].v[k]=v;save();}
function chkS(i){S.spot[i]=S.spot[i]||{v:{}};S.spot[i].checked=true;save();render();}
function clrS(i){delete S.spot[i];save();render();}

function rCases(){return D.cases.map((cs,i)=>`<div class="card" style="--c:${COLORS[(i+4)%8]}"><span class="pill pt">Clinical case ${i+1}</span><h3 style="margin:6px 0">${esc(cs.title)}</h3>
 <div class="stem">${esc(cs.stem)}</div>${cs.qa.map(([q,a],k)=>{const id=i+'_'+k;return `<div style="margin-top:12px"><b>Q${k+1}. ${esc(q)}</b>
 <textarea placeholder="Write your answer first…" oninput="S.notes['${id}']=this.value;save()">${esc(S.notes[id]||'')}</textarea>
 <button class="btn alt" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="ans">${esc(a)}</div></div>`}).join('')}</div>`).join('');}

function rScore(){let m=0;D.mcq.forEach((q,i)=>{if(S.mcq[i]===q.ans)m++;});
 let mt=0,mn=0;D.match.forEach((x,i)=>{mn+=x.terms.length;const st=S.match[i];if(st&&st.checked)x.terms.forEach((_,k)=>{if(st.v&&st.v[k]!==undefined&&st.v[k]!==''&&+st.v[k]===k)mt++;});});
 let sp=0,sn=0;D.spot.forEach((x,i)=>{sn+=x.items.length;const st=S.spot[i];if(st&&st.checked)x.items.forEach(([_,a],k)=>{if(st.v&&st.v[k]!==undefined&&st.v[k]!==''&&+st.v[k]===a)sp++;});});
 const tot=m+mt+sp,max=D.mcq.length+mn+sn;const pct=Math.round(tot/max*100);
 const line=(l,a,b)=>`<p style="margin:10px 0 2px"><b>${l}</b>: ${a} / ${b}</p><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div>`;
 return `<div class="card" style="--c:#2E1A47"><div class="score">${tot} / ${max} (${pct}%)</div>${line('Case MCQs',m,D.mcq.length)}${line('Matching',mt,mn)}${line('Spotters',sp,sn)}
 <p>${pct>=80?'Well done. You are ready for the session.':pct>=50?'Good start. Go back over the items you missed.':'Revisit the self-reading slides, then try again.'}</p>
 <button class="btn alt" onclick="resetAll()">Reset everything</button></div>`;}
function resetPart(p){S[p]={};save();render();}
function resetAll(){S={mcq:{},match:{},spot:{},notes:{}};save();render();}

function render(){const f={mcq:rMCQ,match:rMatch,spot:rSpot,cases:rCases,score:rScore}[cur];document.getElementById('main').innerHTML=f();}
nav();render();
</script></body></html>
